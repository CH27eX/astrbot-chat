<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：软键盘弹出时缩小**布局视口**，
         输入条才会贴在键盘上面（Chrome 108+；老 WebView 由 core/viewport.ts 兜底） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="AstrBot Chat — 本地优先、可迁移到云端的 AstrBot 聊天客户端"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>AstrBot Chat</title>
    <!-- 冷启动骨架的样式必须内联：外链 CSS 还在下载时，手机 WebView 会先给一帧白底，
         那一下就是用户说的「打开是白的」。这块深色底 + 品牌标记替掉那一帧。 -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b0d12;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0d12;
        color: #cbd5e1;
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        transition: opacity 0.18s ease;
      }
      #boot-splash.boot-done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-weight: 700;
        color: #0b0d12;
        background: linear-gradient(135deg, #6ea8fe, #a78bfa);
      }
      .boot-bar {
        width: 96px;
        height: 3px;
        border-radius: 99px;
        background: #232838;
        overflow: hidden;
      }
      .boot-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 99px;
        background: #6ea8fe;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      .boot-text {
        margin: 0;
        font-size: 12px;
        color: #8b93a7;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar span {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <!-- 冷启动骨架：JS 还没下载/执行时先看到品牌和进度条，而不是白屏或黑屏。
         React 挂载后由 src/main.tsx 淡出并移除。 -->
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-mark" aria-hidden="true">A</div>
      <div class="boot-bar" aria-hidden="true"><span></span></div>
      <p class="boot-text" id="boot-text">正在连接 AstrBot…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // JS 压根没跑起来时（BFF 没起 / 资源 404），别让骨架永远停在「正在连接…」
      setTimeout(function () {
        var text = document.getElementById("boot-text");
        if (text) {
          text.textContent = "界面没加载出来：确认 AstrBot Chat 的 BFF 在运行，然后刷新";
        }
      }, 12000);
    </script>
  </body>
</html>
