name: iOS IPA

# 没有 Mac 也能出 iOS 安装包：把仓库推到 GitHub，手动触发这个 workflow，
# 在 GitHub 的 macOS runner 上编译，产物（未签名 ipa）在 Actions 的 Artifacts 里。
# 未签名 ipa 用 Sideloadly / AltStore 自签安装，详见 docs/TESTER-GUIDE-IOS.md。
on:
  workflow_dispatch:
    inputs:
      signed:
        description: "有开发者证书时填 Team ID（留空 = 不签名 ipa）"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build unsigned IPA
        if: ${{ inputs.signed == '' }}
        run: bash scripts/build-ios.sh

      - name: Build signed IPA
        if: ${{ inputs.signed != '' }}
        env:
          TEAM_ID: ${{ inputs.signed }}
        run: bash scripts/build-ios.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AstrBot-Chat-ios-ipa
          path: build/ios/*.ipa
          if-no-files-found: error
